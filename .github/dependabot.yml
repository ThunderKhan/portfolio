version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      browser-tooling:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Etc/UTC
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    groups:
      action-updates:
        patterns: ['*']
