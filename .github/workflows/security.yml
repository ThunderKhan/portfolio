name: Portfolio Security

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  secrets:
    name: Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 --connect-timeout 15 --max-time 180 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Scan reachable Git history (redacted)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-report.XXXXXXXX")"
          trap 'rm -rf "$report_dir"' EXIT
          report="$report_dir/findings.json"
          status=0
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --log-opts="--all" --redact=100 --exit-code=1 --report-format=json --report-path="$report" . || status=$?
          # Do not print match, secret, commit message or author fields.
          if [[ -f "$report" ]]; then
            jq -a -c '.[] | {RuleID, File, StartLine, EndLine, Commit, Fingerprint}' "$report"
          elif [[ "$status" -eq 0 ]]; then
            echo "::error::Secret scanner did not write the expected report"
            exit 1
          fi
          exit "$status"

  image:
    name: Container vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and verify local image
        run: node scripts/audit-docker.mjs
      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 --connect-timeout 15 --max-time 180 -o "$archive" https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          printf '%s  %s\n' 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy-bin" trivy
          "$RUNNER_TEMP/trivy-bin/trivy" --version
      - name: Inspect runtime zlib and MiniZip package evidence
        shell: bash
        run: |
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges:true --entrypoint sh mark-i:security-check -ec '
            dpkg-query -W zlib1g
            dpkg-query -L zlib1g
            dpkg-query -W > /tmp/installed-packages
            grep -i minizip /tmp/installed-packages || test "$?" -eq 1
            find /usr /opt /app -iname "*minizip*" -print
          '
      - name: Report all image vulnerabilities
        id: inventory
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --image-src docker --scanners vuln --timeout 10m --exit-code 0 --format table mark-i:security-check
      - name: Block critical vulnerabilities
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --image-src docker --scanners vuln --timeout 10m --skip-db-update --severity CRITICAL --exit-code 1 mark-i:security-check
      - name: Block fixable high vulnerabilities
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy-bin/trivy" image --image-src docker --scanners vuln --timeout 10m --skip-db-update --severity HIGH --ignore-unfixed --exit-code 1 mark-i:security-check

  dependencies:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit committed lockfiles without installing packages
        run: |
          npm audit --package-lock-only
          npm audit --package-lock-only --omit=dev
          npm --prefix tests/browser audit --package-lock-only
